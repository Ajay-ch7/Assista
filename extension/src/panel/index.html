<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assista</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main>
      <h1>Assista</h1>
      <p id="status" data-connection="closed" data-turn="idle">Starting.</p>
      <div id="controls">
        <button id="talk-button" type="button">Hold to talk</button>
        <button id="stop-button" type="button">Stop speaking</button>
      </div>
      <ol id="log" aria-label="Conversation"></ol>
      <form id="text-form">
        <label for="text-input">Type a request</label>
        <input id="text-input" type="text" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
