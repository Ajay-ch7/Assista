<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monsoon report - Valley Weather Office</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        color: #1c1c1c;
        background: #ffffff;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 1rem;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #999999;
        padding: 0.25rem 0.75rem;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Monsoon report 2026</h1>
      <p>Rainfall measured at the Valley Weather Office, compared with the ten-year average.</p>

      <h2>Rainfall by month</h2>
      <table>
        <caption>
          Rainfall in millimetres, June to September
        </caption>
        <tr>
          <th scope="col">Month</th>
          <th scope="col">2026</th>
          <th scope="col">Ten-year average</th>
        </tr>
        <tr>
          <td>June</td>
          <td>182</td>
          <td>165</td>
        </tr>
        <tr>
          <td>July</td>
          <td>341</td>
          <td>290</td>
        </tr>
        <tr>
          <td>August</td>
          <td>298</td>
          <td>305</td>
        </tr>
        <tr>
          <td>September</td>
          <td>154</td>
          <td>172</td>
        </tr>
      </table>

      <h2>Reservoir level</h2>
      <!-- Drawn with no text alternative, as many charts are: only a picture can tell it. -->
      <canvas id="chart" width="520" height="260"></canvas>
    </main>

    <script>
      const levels = [
        ['Jun', 38],
        ['Jul', 61],
        ['Aug', 84],
        ['Sep', 92],
      ];
      const ctx = document.getElementById('chart').getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 520, 260);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillStyle = '#1c1c1c';
      ctx.fillText('Reservoir level, percent full', 20, 22);
      levels.forEach(([month, level], index) => {
        const x = 50 + index * 115;
        const height = level * 2;
        ctx.fillStyle = '#2b6cb0';
        ctx.fillRect(x, 230 - height, 70, height);
        ctx.fillStyle = '#1c1c1c';
        ctx.fillText(month, x + 22, 250);
        ctx.fillText(`${level}%`, x + 20, 224 - height);
      });
    </script>
  </body>
</html>
